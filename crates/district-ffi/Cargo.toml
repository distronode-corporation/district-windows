[package]
name = "district-ffi"
description = "The boundary District AI for Windows calls: one Core object over the shared Rust core, a view of each screen, and the Windows session store."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true
publish.workspace = true

[lib]
# `cdylib` is what the C# app loads (district_ffi.dll on Windows; the Linux
# libdistrict_ffi.so is what DistrictAI.Core.Tests load). `lib` is for this
# crate's own tests.
crate-type = ["cdylib", "lib"]

[dependencies]
async-trait = { workspace = true }
district-api = { workspace = true }
district-auth = { workspace = true }
district-call = { workspace = true }
district-core = { workspace = true }
district-host = { workspace = true }
district-live = { workspace = true }
district-model = { workspace = true }
# NOT for logging: nothing in this crate logs. The `max_level_warn` feature
# compiles every `info!`, `debug!` and `trace!` of every crate in the build out
# of the binary, and Cargo unifies features across a build, so naming it here
# holds the ceiling for the whole DLL even if the core's own pin moved. The
# reason is the core's: tungstenite logs the telemetry token at trace level, and
# libwebrtc (through the LiveKit SDK, once calls land) logs an encrypted room's
# key at debug level. `tests::log_ceiling` fails if the ceiling goes.
log = { workspace = true }
serde = { workspace = true }
# The session credential's JSON, and the revoke outbox's.
serde_json = { workspace = true }
thiserror = { workspace = true }
# `rt-multi-thread` for the runtime the core runs on, `sync` for the actor's
# channels, `time` for the bound on the work done at shutdown.
tokio = { workspace = true, features = ["rt-multi-thread", "sync", "time"] }
uniffi = { workspace = true }
url = { workspace = true }

[target.'cfg(windows)'.dependencies]
# The LiveKit call engine, on Windows only: `district_call::engine()` is then
# `LiveKitCallEngine` and `CALLS_AVAILABLE` is true. It links libwebrtc, the
# audio-only build scripts/fetch-libwebrtc.ps1 fetches and LK_CUSTOM_WEBRTC
# names (CONTRIBUTING.md, "Building with calls"); that library is built with the
# static CRT, which is why .cargo/config.toml builds Rust with +crt-static. The
# Linux build of this crate, which only DistrictAI.Core.Tests loads, keeps the
# engine that joins nothing.
# wf-xaml-check: no LiveKit engine, so no libwebrtc to fetch.
keyring = { workspace = true }

[dev-dependencies]
tempfile = { workspace = true }
tokio = { workspace = true, features = ["rt-multi-thread", "sync", "time", "macros", "test-util"] }

[lints]
# The workspace's, `unsafe_code = "forbid"` included. UniFFI's scaffolding is
# `extern "C"` code generated by its macros, and the lint does not reach into an
# external macro's expansion, so this crate needs no exception (proved by this
# crate building at `forbid`). scripts/check-unsafe.py also fails CI on the
# word `unsafe` in any hand-written file under crates/*/src.
workspace = true
