# cargo-deny policy, run by the `cargo-deny` job in .github/workflows/ci.yml
# (`cargo deny --locked check`). Four checks: RustSec advisories, licences,
# banned crates, allowed sources.

[graph]
# The target the app ships (x64 Windows, MSVC) and the one CI tests the C#
# library against (Linux). Crates that only build elsewhere are not judged.
targets = ["x86_64-pc-windows-msvc", "x86_64-unknown-linux-gnu"]
all-features = true

[advisories]
# Unmaintained and unsound notices for the WHOLE tree, so a new one anywhere is
# a decision rather than noise. Every entry below says why it is tolerated and
# what would retire it.
unmaintained = "all"
unsound = "all"
ignore = [
  # chrono 0.4.45: unmaintained notice (RUSTSEC-2026-0543, 2026-11-18), all versions, no
  # fixed release; not a vulnerability. No crate here depends on it: it arrives only with
  # calls, through district-core-rust's district-call 13.0.0 (feature `livekit`, a
  # cfg(windows) dependency of district-ffi, so in every shipped build) -> livekit 0.10.1
  # directly, and through livekit-data-stream 0.2.0 and livekit-protocol 0.8.2 ->
  # pbjson-types 0.9.0. It goes when livekit and pbjson-types drop chrono, the core takes
  # that release and this repository the core tag (issue #147). Review by 2027-02-18.
  { id = "RUSTSEC-2026-0543", reason = "chrono unmaintained, all versions, no fixed release; not a vulnerability; via district-call (district-core-rust) -> livekit 0.10.1, livekit-data-stream, pbjson-types, the Windows call engine; migration tracked in #147; review by 2027-02-18" },
]

[licenses]
# The project is Apache-2.0: permissive licences only. The same list as
# district-core-rust and District AI for Linux.
allow = [
  "Apache-2.0",
  "Apache-2.0 WITH LLVM-exception",
  "MIT",
  "BSD-2-Clause",
  "BSD-3-Clause",
  "ISC",
  "Zlib",
  "Unicode-3.0",
  "Unlicense",
  "CC0-1.0",
  "MPL-2.0",
  "0BSD",
]
confidence-threshold = 0.9

[licenses.private]
# The workspace's own crates and the core's are not published to crates.io.
ignore = true

[bans]
multiple-versions = "allow"
wildcards = "deny"
allow-wildcard-paths = true

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
# The shared core, and nothing else, by git.
allow-git = ["https://github.com/distronode-corporation/district-core-rust"]
