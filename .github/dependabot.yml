version: 2

# Every `uses:` in the workflows is pinned to a commit with a `# vX.Y.Z` comment, which
# is right for supply-chain safety and wrong for noticing a security fix, because a
# pinned SHA never moves on its own. This turns each pin into a pull request.
#
# `cooldown` holds a version update back until the release is a week old, so a
# compromised publish that is yanked within days never reaches a pull request here.
# It does not delay security updates.
#
# `cargo` opens pull requests against Cargo.lock, which CI enforces with
# `--locked`. The UniFFI pin is exact and moves only together with
# uniffi-bindgen-cs, so Dependabot leaves it alone; so does the core, which is a
# git dependency pinned by tag and moved by hand.
#
# `nuget` bumps Directory.Packages.props; each pull request needs the lock files
# written again (`dotnet restore -p:RestoreLockedMode=false`), or restore fails
# in CI, which is the point.
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    cooldown:
      default-days: 7
    groups:
      actions-minor:
        update-types: [minor, patch]

  - package-ecosystem: cargo
    directory: /
    schedule:
      interval: weekly
    cooldown:
      default-days: 7
    groups:
      cargo-minor:
        update-types: [minor, patch]
    ignore:
      - dependency-name: uniffi

  - package-ecosystem: nuget
    directory: /
    schedule:
      interval: weekly
    cooldown:
      default-days: 7
    groups:
      nuget-minor:
        update-types: [minor, patch]
