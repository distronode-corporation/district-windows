name: Release

# Fires on a `vX.Y.Z` tag and publishes District AI for Windows: the Store
# package Partner Center takes (an unsigned .msixupload; the Store signs what it
# ships), a sideload test MSIX signed with a throwaway certificate and that
# certificate's public half, a zip of the framework packages the test MSIX
# needs (the Windows App Runtime, x64 and x86), the Windows App Certification Kit's report
# on the package, the GitHub flavour as an unsigned MSIX (for the SignPath
# Foundation code-signing application; it is not meant to be installed), a
# source zip, SHA256SUMS over all of them, and the signed provenance
# attestation over them (`district-ai-windows_<version>.intoto.jsonl`).
#
# Five stages, and only the last two can write anything:
#
# - `guard` refuses a tag that should not be built: one on a commit that is not
#   on main (CI never tested it), one that Package.appxmanifest's Version does
#   not name (tag vX.Y.Z needs Version X.Y.Z.0), one without a CHANGELOG.md
#   section to make the notes from, or one whose catalogs are not the ones
#   i18n/fr-CA/signoff.json signed off. It also makes the source zip.
# - `build` builds the Store and sideload packages and the unsigned GitHub
#   flavour on windows-2025 from the committed lock files, with no caches,
#   checks what is inside them (identity, version, ReadyToRun), and runs the
#   Windows App Certification Kit on the sideload package.
# - `assemble` checks the files are exactly the names a release carries and
#   writes SHA256SUMS.
# - `publish` attests the files' provenance, verifies the attestations, creates
#   a DRAFT release, checks that GitHub holds exactly the expected files, and
#   only then makes the release public.
# - `sentry`, once the release is public, uploads the debug files `build`
#   kept (district_ffi.dll with its PDB, and the app's three assemblies with
#   their embedded portable PDBs, as the packages carry them) and creates the
#   Sentry release the crash reports name,
#   `com.distronode.DistrictAI@<version>+<the commit's first twelve
#   characters>`, with its commits, then finalizes it. After `publish`, so a
#   release that never went out has nothing in Sentry, and a Sentry outage
#   never holds a release back: a failed run is re-run once Sentry answers,
#   which uploads only what Sentry does not hold yet.
#
# Crash reports are off in every build until its user says yes. The packages
# carry the DSN reports go to, the WINDOWS_SENTRY_DSN repository secret, which
# `build` bakes into the app only for a tag push (a pull request's dry run
# builds without it), with DISTRICT_AI_BUILD, the commit's first twelve
# characters (src/DistrictAI/Platform/CrashReporter.cs). `sentry` needs
# SENTRY_AUTH_TOKEN, a secret of the `release` environment.
#
# Pull requests that touch this workflow or the packaging run the first three
# stages as a dry run: the same build and certification, nothing attested and
# nothing released.
#
# Artifact attestations need the repository to be public (or GitHub Enterprise
# Cloud); in a private repository `publish` fails at the attestation.
on:
  push:
    tags: ['v*']
  pull_request:
    paths:
      - .github/workflows/release.yml
      - src/DistrictAI/Package.appxmanifest
      - src/DistrictAI/Package.GitHub.appxmanifest
      - src/DistrictAI/DistrictAI.csproj
      - src/DistrictAI/packages.lock.json
      - src/DistrictAI/app.manifest
      - src/DistrictAI/Assets/**
      - Directory.Build.props
      - Directory.Packages.props
      - global.json
      - scripts/run-wack.ps1
      - scripts/check-wack-report.py
      - scripts/check-scripted.py
      - scripts/check-languages.py
      - scripts/gen-l10n.py

permissions:
  contents: read

# Never cancel a release in flight: a cancelled publish can leave a draft with
# only some of its assets. A superseded pull request dry run is waste.
concurrency:
  group: release-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  DOTNET_CLI_TELEMETRY_OPTOUT: "1"
  DOTNET_NOLOGO: "1"
  # True for a tag push, the only event that can publish.
  RELEASING: ${{ github.event_name == 'push' }}

jobs:
  guard:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    outputs:
      version: ${{ steps.version.outputs.version }}
      body: ${{ steps.notes.outputs.body }}
    steps:
      # The whole history and every branch, for the ancestry check below.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      # A tag is not a branch, and CI does not run on one: a tag on a commit
      # that never reached main would be built and released untested.
      - name: The tagged commit is on main
        if: github.event_name == 'push'
        run: |
          set -euo pipefail
          if ! git rev-parse --verify --quiet refs/remotes/origin/main > /dev/null; then
            echo "::error::the checkout has no origin/main to compare the tag with"
            exit 1
          fi
          if ! git merge-base --is-ancestor "$GITHUB_SHA" refs/remotes/origin/main; then
            echo "::error::$GITHUB_REF_NAME points at $GITHUB_SHA, which is not on main."
            echo "CI never ran on this commit. Merge it to main first, then move the tag."
            exit 1
          fi
          echo "$GITHUB_SHA is on main"

      # The French is signed off per release: every catalog must be the one
      # i18n/fr-CA/signoff.json records, and scripts/check-fr-signoff.py names
      # each one that is not. On a tag only; a pull request's dry run is not a
      # release, and catalogs change between releases (CONTRIBUTING.md,
      # "Releasing").
      - name: The catalogs are the signed-off French
        if: github.event_name == 'push'
        run: python3 scripts/check-fr-signoff.py

      # Tag vX.Y.Z needs Identity/@Version X.Y.Z.0 (the Store requires the
      # fourth part to be 0). A pull request has no tag, so its dry run takes
      # the manifest's version and checks only its form.
      - name: Package.appxmanifest's version agrees with the tag
        id: version
        env:
          EVENT: ${{ github.event_name }}
        run: |
          set -euo pipefail
          python3 - <<'EOF'
          import os, re, xml.etree.ElementTree as ET
          ns = {"m": "http://schemas.microsoft.com/appx/manifest/foundation/windows10"}
          identity = ET.parse("src/DistrictAI/Package.appxmanifest").getroot().find("m:Identity", ns)
          manifest = identity.get("Version", "") if identity is not None else ""
          m = re.fullmatch(r"(\d+)\.(\d+)\.(\d+)\.0", manifest)
          if not m:
              raise SystemExit(f"::error::Package.appxmanifest Identity/@Version is {manifest!r}, not X.Y.Z.0")
          version = ".".join(m.groups())
          if os.environ["EVENT"] == "push":
              tag = os.environ["GITHUB_REF_NAME"]
              if not re.fullmatch(r"v\d+\.\d+\.\d+", tag):
                  raise SystemExit(f"::error::{tag} is not a vX.Y.Z tag")
              if tag != f"v{version}":
                  raise SystemExit(f"::error::the tag is {tag}, but Package.appxmanifest says {manifest}; a release needs Version {tag[1:]}.0")
          print(f"Package.appxmanifest Version {manifest}: release version {version}")
          with open(os.environ["GITHUB_OUTPUT"], "a", encoding="utf-8") as out:
              out.write(f"version={version}\n")
          EOF

      # The tag's section of CHANGELOG.md, so the release notes and the
      # changelog cannot drift. A dry run only warns when it is missing.
      - name: Extract release notes from CHANGELOG.md
        id: notes
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          set -euo pipefail
          awk -v tag="## [${VERSION}]" '
            index($0, tag)==1 {cap=1; next}
            index($0, "## [")==1 && cap==1 {cap=0}
            substr($0,1,1)=="[" && cap==1 {exit}
            cap {print}
          ' CHANGELOG.md > release-notes.md
          if ! grep -q '[^[:space:]]' release-notes.md; then
            if [ "$RELEASING" = "true" ]; then
              echo "::error::CHANGELOG.md has no section for $VERSION (## [$VERSION]) to make the release notes from"
              exit 1
            fi
            echo "::warning::CHANGELOG.md has no section for $VERSION yet; a tag would fail here"
            echo "(dry run: no notes)" > release-notes.md
          fi
          # One fixed line for the asset that is not for people to install.
          {
            echo
            echo "DistrictAI_${VERSION}_x64_github-unsigned.msix is the GitHub flavour, unsigned, for the SignPath Foundation code-signing application. It is not meant to be installed."
          } >> release-notes.md
          delim="body_$(openssl rand -hex 16)"
          {
            echo "body<<${delim}"
            cat release-notes.md
            echo "${delim}"
          } >> "$GITHUB_OUTPUT"

      # The source at the tagged commit, as GitHub's own archive would be but
      # covered by SHA256SUMS and the attestation.
      - name: Source zip
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/source"
          git archive --format=zip --prefix="district-windows-${VERSION}/" \
            -o "$RUNNER_TEMP/source/district-windows-${VERSION}-source.zip" "$GITHUB_SHA"
          ls -l "$RUNNER_TEMP/source"

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: release-source
          path: ${{ runner.temp }}/source
          retention-days: 7
          if-no-files-found: error

  # Read-only, deliberately, and with no caches: it runs `cargo build`, which
  # executes every build script in the dependency tree, so it holds no write
  # permission and restores nothing an earlier run could have poisoned.
  build:
    needs: guard
    if: ${{ !github.event.repository.private }}
    runs-on: windows-2025
    timeout-minutes: 90
    permissions:
      contents: read
    env:
      AWS_LC_SYS_PREBUILT_NASM: "1"
      VERSION: ${{ needs.guard.outputs.version }}
      # French (fr-CA): every package built here passes it as
      # -p:DistrictFrench, and "Each package declares French exactly when it
      # should" holds the packages to it. On from 3.0: every catalog has
      # reviewed French.
      DISTRICT_FRENCH: "true"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install the stable toolchain
        run: rustup toolchain install stable --profile minimal

      # The audio-only libwebrtc the LiveKit call engine links, so a release
      # has calls: the archive scripts/fetch-libwebrtc.ps1 pins, checked against
      # its SHA-256, downloaded fresh (no cache here, as above). It sets
      # LK_CUSTOM_WEBRTC, so the SDK's build never downloads LiveKit's own
      # prebuilt. As District AI for Linux's release.yml does, a release is
      # refused unless the repository variable LIBWEBRTC_LICENCE_CLEARED says
      # this library's licensing has been cleared.
      - name: Fetch and verify libwebrtc
        shell: pwsh
        env:
          CLEARED: ${{ vars.LIBWEBRTC_LICENCE_CLEARED }}
        run: |
          if ($env:CLEARED -ne 'true') {
            Write-Output "::error::Refusing to build a release: the repository variable LIBWEBRTC_LICENCE_CLEARED is '$env:CLEARED', not 'true'."
            exit 1
          }
          ./scripts/fetch-libwebrtc.ps1 (Join-Path $env:RUNNER_TEMP 'libwebrtc') -GitHubEnv

      # With line tables, so the PDB the linker writes beside it
      # (target/release/district_ffi.pdb, never packaged) gives a crash report
      # from the Rust side its files and lines once Sentry has it.
      - name: Build district_ffi.dll
        env:
          CARGO_PROFILE_RELEASE_DEBUG: line-tables-only
        run: cargo build -p district-ffi --locked --release

      - uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          global-json-file: global.json

      - name: dotnet restore (locked)
        run: dotnet restore DistrictAI.slnx -p:Platform=x64

      # What the three package builds below stamp on the app
      # (DistrictAI.csproj) for its crash reports: the commit's first twelve
      # characters, as the Sentry release names it, here; and, in each of the
      # three steps' own environment and only for a tag push, the DSN. The DSN
      # is a repository secret because this job runs in no environment; it is
      # no secret from anyone holding the package, which carries it. No token
      # reaches this job. A tag without the DSN is refused rather than released
      # without crash reports.
      - name: Name the build for crash reports
        shell: pwsh
        env:
          DSN: ${{ github.event_name == 'push' && secrets.WINDOWS_SENTRY_DSN || '' }}
        run: |
          $ErrorActionPreference = 'Stop'
          if ($env:RELEASING -eq 'true' -and -not $env:DSN) { throw 'the WINDOWS_SENTRY_DSN secret is not set: this release would carry no crash reports' }
          "DISTRICT_AI_BUILD=$($env:GITHUB_SHA.Substring(0, 12))" >> $env:GITHUB_ENV

      # The package Partner Center takes: StoreUpload, x64, Release,
      # ReadyToRun, no bundle, unsigned (the Store signs it). No PDB files and
      # no symbols package, as in ci.yml: with PDB files in the payload the
      # packaging step needs mspdbcmf.exe, which the runner does not have. The
      # PDBs are embedded in the assemblies instead (DebugType=embedded, here
      # and in the two builds below), so a crash report from the .NET side
      # carries its files and lines, and `sentry` uploads them as they ship.
      - name: Build the Store package (.msixupload)
        shell: pwsh
        env:
          WINDOWS_SENTRY_DSN: ${{ github.event_name == 'push' && secrets.WINDOWS_SENTRY_DSN || '' }}
        run: |
          $ErrorActionPreference = 'Stop'
          $out = Join-Path $env:RUNNER_TEMP 'StorePackage'
          dotnet build src/DistrictAI/DistrictAI.csproj -c Release -p:Platform=x64 `
            -p:DistrictFfiProfile=release -warnaserror "-p:DistrictFrench=$env:DISTRICT_FRENCH" `
            -p:GenerateAppxPackageOnBuild=true -p:UapAppxPackageBuildMode=StoreUpload `
            -p:AppxBundle=Never -p:AppxPackageSigningEnabled=false -p:PublishReadyToRun=true `
            -p:AppxSymbolPackageEnabled=false -p:DebugType=embedded "-p:AppxPackageDir=$out\"
          if ($LASTEXITCODE -ne 0) { throw "dotnet build failed with $LASTEXITCODE" }
          Get-ChildItem -Recurse $out | Select-Object FullName, Length | Format-Table -AutoSize

      # A certificate made here, for this run's package only: its subject is the
      # manifest's Publisher, it expires tomorrow, and it is removed from the
      # store, private key and all, as soon as the package is signed. The
      # package is signed by thumbprint, so the private key is never written to
      # a file. Only the public half is kept, so a tester can trust it.
      - name: Build the sideload test MSIX, signed with a throwaway certificate
        shell: pwsh
        env:
          WINDOWS_SENTRY_DSN: ${{ github.event_name == 'push' && secrets.WINDOWS_SENTRY_DSN || '' }}
        run: |
          $ErrorActionPreference = 'Stop'
          $publisher = ([xml](Get-Content src/DistrictAI/Package.appxmanifest)).Package.Identity.Publisher
          if (-not $publisher) { throw 'no Identity/@Publisher in the manifest' }
          $cert = New-SelfSignedCertificate -Type Custom -Subject $publisher `
            -KeyUsage DigitalSignature -FriendlyName 'District AI release test package' `
            -CertStoreLocation 'Cert:\CurrentUser\My' -NotAfter (Get-Date).AddDays(1) `
            -TextExtension @('2.5.29.37={text}1.3.6.1.5.5.7.3.3', '2.5.29.19={text}')
          $out = Join-Path $env:RUNNER_TEMP 'SideloadPackage'
          try {
            dotnet build src/DistrictAI/DistrictAI.csproj -c Release -p:Platform=x64 `
              -p:DistrictFfiProfile=release -warnaserror "-p:DistrictFrench=$env:DISTRICT_FRENCH" `
              -p:GenerateAppxPackageOnBuild=true -p:UapAppxPackageBuildMode=SideloadOnly `
              -p:AppxBundle=Never -p:AppxPackageSigningEnabled=true -p:PublishReadyToRun=true `
              -p:AppxSymbolPackageEnabled=false -p:DebugType=embedded `
              "-p:PackageCertificateThumbprint=$($cert.Thumbprint)" "-p:AppxPackageDir=$out\"
            if ($LASTEXITCODE -ne 0) { throw "dotnet build failed with $LASTEXITCODE" }
            Export-Certificate -Cert $cert -FilePath (Join-Path $out 'test.cer') | Out-Null
          } finally {
            Remove-Item -Path "Cert:\CurrentUser\My\$($cert.Thumbprint)" -DeleteKey
          }
          if (Get-ChildItem -Path 'Cert:\CurrentUser\My' | Where-Object Thumbprint -eq $cert.Thumbprint) { throw 'the test certificate is still in the store' }
          Get-ChildItem -Recurse $out | Select-Object FullName, Length | Format-Table -AutoSize

      # The GitHub flavour (Package.GitHub.appxmanifest), unsigned: the asset
      # the SignPath Foundation code-signing application points at. Its
      # Publisher is meant for SignPath Foundation's certificate, so nothing
      # here can sign it, and an unsigned package does not install normally.
      - name: Build the GitHub flavour MSIX, unsigned
        shell: pwsh
        env:
          WINDOWS_SENTRY_DSN: ${{ github.event_name == 'push' && secrets.WINDOWS_SENTRY_DSN || '' }}
        run: |
          $ErrorActionPreference = 'Stop'
          $out = Join-Path $env:RUNNER_TEMP 'GitHubPackage'
          dotnet build src/DistrictAI/DistrictAI.csproj -c Release -p:Platform=x64 `
            -p:DistrictFfiProfile=release -warnaserror -p:DistrictFlavour=GitHub "-p:DistrictFrench=$env:DISTRICT_FRENCH" `
            -p:GenerateAppxPackageOnBuild=true -p:UapAppxPackageBuildMode=SideloadOnly `
            -p:AppxBundle=Never -p:AppxPackageSigningEnabled=false -p:PublishReadyToRun=true `
            -p:AppxSymbolPackageEnabled=false -p:DebugType=embedded "-p:AppxPackageDir=$out\"
          if ($LASTEXITCODE -ne 0) { throw "dotnet build failed with $LASTEXITCODE" }
          Get-ChildItem -Recurse $out | Select-Object FullName, Length | Format-Table -AutoSize

      # What is inside, checked rather than assumed: one package each, its
      # manifest's identity and version, DistrictAI.dll compiled ReadyToRun,
      # the test package signed by the manifest's Publisher, and the Store and
      # GitHub packages unsigned.
      - name: Both packages hold what a release needs
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          Add-Type -AssemblyName System.IO.Compression.FileSystem
          $manifest = ([xml](Get-Content src/DistrictAI/Package.appxmanifest)).Package.Identity
          if ($manifest.Version -ne "$env:VERSION.0") { throw "manifest Version $($manifest.Version) is not $env:VERSION.0" }
          $github = ([xml](Get-Content src/DistrictAI/Package.GitHub.appxmanifest)).Package.Identity
          if ($github.Version -ne "$env:VERSION.0") { throw "GitHub manifest Version $($github.Version) is not $env:VERSION.0" }
          if ($github.Name -eq $manifest.Name -or $github.Publisher -eq $manifest.Publisher) { throw 'the GitHub manifest has the Store identity' }
          $work = Join-Path $env:RUNNER_TEMP 'inspect'
          New-Item -ItemType Directory -Force $work | Out-Null

          function Test-Msix([string] $path, [string] $label, $expected) {
            $zip = [IO.Compression.ZipFile]::OpenRead($path)
            try {
              $entry = $zip.GetEntry('AppxManifest.xml')
              if (-not $entry) { throw "$label has no AppxManifest.xml" }
              $reader = [IO.StreamReader]::new($entry.Open())
              $identity = ([xml]$reader.ReadToEnd()).Package.Identity
              $reader.Dispose()
              foreach ($field in 'Name', 'Publisher', 'Version') {
                if ($identity.$field -ne $expected.$field) { throw "$label Identity/@$field is '$($identity.$field)', the manifest says '$($expected.$field)'" }
              }
              if ($identity.ProcessorArchitecture -ne 'x64') { throw "$label is $($identity.ProcessorArchitecture), not x64" }
              $dll = @($zip.Entries | Where-Object FullName -eq 'DistrictAI.dll')
              if ($dll.Count -ne 1) { throw "$label has no DistrictAI.dll at its root" }
              if (-not $zip.GetEntry('ThirdPartyNotices/libwebrtc-LICENSE.md')) { throw "$label has no ThirdPartyNotices/libwebrtc-LICENSE.md" }
              # Self-contained: the package carries .NET, which no Store install
              # provides (v1.0.0 did not start on a PC without the .NET Desktop Runtime).
              foreach ($runtime in 'hostfxr.dll', 'hostpolicy.dll', 'coreclr.dll') {
                if (-not $zip.GetEntry($runtime)) { throw "$label has no $runtime at its root: it is not self-contained" }
              }
              $config = $zip.GetEntry('DistrictAI.runtimeconfig.json')
              if (-not $config) { throw "$label has no DistrictAI.runtimeconfig.json" }
              $reader = [IO.StreamReader]::new($config.Open())
              $runtimeConfig = $reader.ReadToEnd() | ConvertFrom-Json
              $reader.Dispose()
              if (-not $runtimeConfig.runtimeOptions.includedFrameworks) { throw "$label's runtimeconfig has no includedFrameworks: it is framework-dependent" }
              $file = Join-Path $work "$label-DistrictAI.dll"
              [IO.Compression.ZipFileExtensions]::ExtractToFile($dll[0], $file, $true)
              $stream = [IO.File]::OpenRead($file)
              try {
                $pe = [System.Reflection.PortableExecutable.PEReader]::new($stream)
                if ($pe.PEHeaders.CorHeader.ManagedNativeHeaderDirectory.Size -le 0) { throw "$label DistrictAI.dll is not ReadyToRun" }
              } finally { $stream.Dispose() }
              Write-Host "$label`: $($identity.Name) $($identity.Version) x64, ReadyToRun"
            } finally { $zip.Dispose() }
          }

          $upload = @(Get-ChildItem -Recurse (Join-Path $env:RUNNER_TEMP 'StorePackage') -Filter '*.msixupload')
          if ($upload.Count -ne 1) { throw "expected one .msixupload, found $($upload.Count)" }
          $unpacked = Join-Path $work 'msixupload'
          Expand-Archive -Path $upload[0].FullName -DestinationPath $unpacked -Force
          Get-ChildItem -Recurse $unpacked | Select-Object FullName, Length | Format-Table -AutoSize
          $inner = @(Get-ChildItem -Recurse $unpacked -Filter '*.msix')
          if ($inner.Count -ne 1) { throw "expected one .msix inside the .msixupload, found $($inner.Count)" }
          Test-Msix $inner[0].FullName 'store' $manifest
          if ((Get-AuthenticodeSignature $inner[0].FullName).SignerCertificate) { throw 'the Store package is signed; the Store signs it' }

          $sideload = @(Get-ChildItem -Recurse (Join-Path $env:RUNNER_TEMP 'SideloadPackage') -Filter 'DistrictAI_*.msix')
          if ($sideload.Count -ne 1) { throw "expected one sideload MSIX, found $($sideload.Count)" }
          Test-Msix $sideload[0].FullName 'sideload' $manifest
          $signature = Get-AuthenticodeSignature $sideload[0].FullName
          if ($signature.SignerCertificate.Subject -ne $manifest.Publisher) { throw "unexpected signer: $($signature.SignerCertificate.Subject)" }

          $githubMsix = @(Get-ChildItem -Recurse (Join-Path $env:RUNNER_TEMP 'GitHubPackage') -Filter 'DistrictAI_*.msix' | Where-Object { $_.FullName -notmatch '\\Dependencies\\' })
          if ($githubMsix.Count -ne 1) { throw "expected one GitHub flavour MSIX, found $($githubMsix.Count)" }
          Test-Msix $githubMsix[0].FullName 'github' $github
          if ((Get-AuthenticodeSignature $githubMsix[0].FullName).SignerCertificate) { throw 'the GitHub flavour package is signed; this release carries it unsigned' }

      # The files Sentry needs to read a crash report, from what ships: the
      # app's three assemblies out of each package, each holding its CodeView
      # entry and its embedded portable PDB (ReadyToRun must keep both), and
      # district_ffi.dll, the same bytes in every package, with the PDB the
      # linker wrote for it. `sentry` uploads them once the release is public;
      # the name is not release-*, which `assemble` takes as release assets.
      - name: Stage the debug files for crash reports
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          Add-Type -AssemblyName System.IO.Compression.FileSystem
          $debug = Join-Path $env:RUNNER_TEMP 'debug-files'
          $rust = Join-Path $debug 'rust'
          New-Item -ItemType Directory -Force $rust | Out-Null
          $ffi = 'target/release/district_ffi.dll'
          $pdb = 'target/release/district_ffi.pdb'
          if (-not (Test-Path $pdb)) { throw "no ${pdb}: the release build wrote no PDB" }
          Copy-Item $ffi, $pdb $rust
          $ffiHash = (Get-FileHash $ffi -Algorithm SHA256).Hash
          $unpacked = Join-Path $env:RUNNER_TEMP 'inspect\msixupload'
          $packages = [ordered]@{
            store = @(Get-ChildItem -Recurse $unpacked -Filter '*.msix')[0].FullName
            sideload = @(Get-ChildItem -Recurse (Join-Path $env:RUNNER_TEMP 'SideloadPackage') -Filter 'DistrictAI_*.msix')[0].FullName
            github = @(Get-ChildItem -Recurse (Join-Path $env:RUNNER_TEMP 'GitHubPackage') -Filter 'DistrictAI_*.msix' | Where-Object { $_.FullName -notmatch '\\Dependencies\\' })[0].FullName
          }
          foreach ($label in $packages.Keys) {
            $dir = Join-Path $debug "dotnet\$label"
            New-Item -ItemType Directory -Force $dir | Out-Null
            $zip = [IO.Compression.ZipFile]::OpenRead($packages[$label])
            try {
              $packagedFfi = Join-Path $env:RUNNER_TEMP "inspect\$label-district_ffi.dll"
              [IO.Compression.ZipFileExtensions]::ExtractToFile($zip.GetEntry('district_ffi.dll'), $packagedFfi, $true)
              if ((Get-FileHash $packagedFfi -Algorithm SHA256).Hash -ne $ffiHash) { throw "the $label package's district_ffi.dll is not the one the PDB was written for" }
              foreach ($name in 'DistrictAI.dll', 'DistrictAI.Core.dll', 'DistrictAI.Presentation.dll') {
                $entry = $zip.GetEntry($name)
                if (-not $entry) { throw "the $label package has no $name" }
                $file = Join-Path $dir $name
                [IO.Compression.ZipFileExtensions]::ExtractToFile($entry, $file, $true)
                $stream = [IO.File]::OpenRead($file)
                try {
                  $pe = [System.Reflection.PortableExecutable.PEReader]::new($stream)
                  $kinds = @($pe.ReadDebugDirectory() | ForEach-Object { $_.Type.ToString() })
                  foreach ($kind in 'CodeView', 'EmbeddedPortablePdb') {
                    if ($kinds -notcontains $kind) { throw "$label $name has no $kind debug entry (it has: $($kinds -join ', '))" }
                  }
                } finally { $stream.Dispose() }
              }
            } finally { $zip.Dispose() }
          }
          Get-ChildItem -Recurse -File $debug | Select-Object FullName, Length | Format-Table -AutoSize
          $count = @(Get-ChildItem -Recurse -File $debug).Count
          if ($count -ne 11) { throw "expected 11 debug files, found $count" }

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: debug-files-windows
          path: ${{ runner.temp }}/debug-files
          retention-days: 7
          if-no-files-found: error

      # With DISTRICT_FRENCH true (from 3.0) every package must declare fr-CA,
      # in its manifest and in resources.pri, and every catalog must have
      # reviewed French: `l10n.py check --require fr-CA` on each catalog in a
      # call of its own (scripts/gen-l10n.py --require-french), since one call
      # over all of them fails on a key two catalogs both define. With it
      # false no package may declare French (a .resw under the project folder
      # reaches resources.pri whatever the project file says, which is why the
      # French one lives outside it).
      - name: Each package declares French exactly when it should
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          python scripts/check-languages.py --self-test
          if ($LASTEXITCODE -ne 0) { throw 'check-languages.py failed its self-test' }
          if ($env:DISTRICT_FRENCH -eq 'true') {
            python scripts/gen-l10n.py --require-french
            if ($LASTEXITCODE -ne 0) { throw 'French is on, but a catalog lacks reviewed French' }
          }
          $packages = @(
            (Get-ChildItem -Recurse (Join-Path $env:RUNNER_TEMP 'StorePackage') -Filter '*.msixupload')
            (Get-ChildItem -Recurse (Join-Path $env:RUNNER_TEMP 'SideloadPackage') -Filter 'DistrictAI_*.msix')
            (Get-ChildItem -Recurse (Join-Path $env:RUNNER_TEMP 'GitHubPackage') -Filter 'DistrictAI_*.msix' | Where-Object { $_.FullName -notmatch '\\Dependencies\\' })
          ) | ForEach-Object { $_.FullName }
          if ($packages.Count -ne 3) { throw "expected three packages, found $($packages.Count)" }
          python scripts/check-languages.py --french $env:DISTRICT_FRENCH @packages
          if ($LASTEXITCODE -ne 0) { throw "a package's languages disagree with DISTRICT_FRENCH=$env:DISTRICT_FRENCH" }

      # district-ffi's `scripted` feature (made-up data for the UI walk and the
      # Store screenshots) never ships: not in the DLL this job built, nor in
      # any package it made from it.
      - name: No package carries the scripted scenes
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          python scripts/check-scripted.py --self-test
          if ($LASTEXITCODE -ne 0) { throw 'check-scripted.py failed its self-test' }
          $packages = @(
            (Get-ChildItem -Recurse (Join-Path $env:RUNNER_TEMP 'StorePackage') -Filter '*.msixupload')
            (Get-ChildItem -Recurse (Join-Path $env:RUNNER_TEMP 'SideloadPackage') -Filter 'DistrictAI_*.msix')
            (Get-ChildItem -Recurse (Join-Path $env:RUNNER_TEMP 'GitHubPackage') -Filter 'DistrictAI_*.msix' | Where-Object { $_.FullName -notmatch '\\Dependencies\\' })
          ) | ForEach-Object { $_.FullName }
          if ($packages.Count -ne 3) { throw "expected three packages, found $($packages.Count)" }
          python scripts/check-scripted.py --absent target/release/district_ffi.dll @packages
          if ($LASTEXITCODE -ne 0) { throw 'a release build carries the scripted scenes' }

      - name: The WACK report reader still catches what it claims to
        run: python scripts/check-wack-report.py --self-test

      # The Store's certification checks, on the signed test package (the kit
      # installs what it tests, so it needs a signature it can trust; the
      # .msixupload holds the same payload, unsigned).
      - name: Windows App Certification Kit
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $out = Join-Path $env:RUNNER_TEMP 'SideloadPackage'
          $msix = @(Get-ChildItem -Recurse $out -Filter 'DistrictAI_*.msix')[0]
          $deps = Join-Path $msix.DirectoryName 'Dependencies\x64'
          ./scripts/run-wack.ps1 -Package $msix.FullName -Certificate (Join-Path $out 'test.cer') `
            -Report (Join-Path $env:RUNNER_TEMP 'wack-report.xml') -Dependencies $(if (Test-Path $deps) { $deps } else { '' })

      # The names a release carries, fixed here.
      - name: Stage the release files
        if: ${{ !cancelled() }}
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $stage = Join-Path $env:RUNNER_TEMP 'release'
          New-Item -ItemType Directory -Force $stage | Out-Null
          $report = Join-Path $env:RUNNER_TEMP 'wack-report.xml'
          if (Test-Path $report) { Copy-Item $report (Join-Path $stage "DistrictAI_$($env:VERSION)_wack-report.xml") }
          $upload = @(Get-ChildItem -Recurse (Join-Path $env:RUNNER_TEMP 'StorePackage') -Filter '*.msixupload')[0]
          Copy-Item $upload.FullName (Join-Path $stage "DistrictAI_$($env:VERSION)_x64.msixupload")
          $side = Join-Path $env:RUNNER_TEMP 'SideloadPackage'
          $msix = @(Get-ChildItem -Recurse $side -Filter 'DistrictAI_*.msix')[0]
          Copy-Item $msix.FullName (Join-Path $stage "DistrictAI_$($env:VERSION)_x64_sideload-test.msix")
          Copy-Item (Join-Path $side 'test.cer') (Join-Path $stage "DistrictAI_$($env:VERSION)_sideload-test.cer")
          $githubMsix = @(Get-ChildItem -Recurse (Join-Path $env:RUNNER_TEMP 'GitHubPackage') -Filter 'DistrictAI_*.msix' | Where-Object { $_.FullName -notmatch '\\Dependencies\\' })
          if ($githubMsix.Count -ne 1) { throw "expected one GitHub flavour MSIX, found $($githubMsix.Count)" }
          Copy-Item $githubMsix[0].FullName (Join-Path $stage "DistrictAI_$($env:VERSION)_x64_github-unsigned.msix")
          # The framework packages the test MSIX depends on (the Windows App
          # Runtime), which a fresh Windows does not have: the x64 one, and the
          # x86 one of the same version, without which a fresh Windows Server
          # 2025 refused the install (0x80073CF9). Both are what this build's
          # Windows App SDK packaged, under Dependencies\x64 and \x86 with one
          # file name, so each goes into the zip flat under a name that says
          # its architecture (Microsoft.WindowsAppRuntime.2_x86.msix). Missing,
          # empty, a package whose architecture is not its folder's, or two
          # runtime versions is a failure: a sideload package nobody can
          # install is no release.
          Add-Type -AssemblyName System.IO.Compression.FileSystem
          $depStage = Join-Path $env:RUNNER_TEMP 'sideload-dependencies'
          New-Item -ItemType Directory -Force $depStage | Out-Null
          $runtime = @{}
          foreach ($arch in 'x64', 'x86') {
            $deps = Join-Path $msix.DirectoryName "Dependencies\$arch"
            if (-not (Test-Path $deps -PathType Container)) { throw "no framework dependencies at $deps" }
            $depFiles = @(Get-ChildItem -Path $deps -Filter '*.msix' -File)
            if ($depFiles.Count -eq 0) { throw "no .msix in $deps" }
            foreach ($dep in $depFiles) {
              $zip = [IO.Compression.ZipFile]::OpenRead($dep.FullName)
              try {
                $entry = $zip.GetEntry('AppxManifest.xml')
                if (-not $entry) { throw "$($dep.FullName) has no AppxManifest.xml" }
                $reader = New-Object IO.StreamReader($entry.Open())
                try { [xml]$manifest = $reader.ReadToEnd() } finally { $reader.Dispose() }
              } finally { $zip.Dispose() }
              $identity = $manifest.Package.Identity
              if ($identity.ProcessorArchitecture -ne $arch) { throw "$($dep.FullName) is for $($identity.ProcessorArchitecture), not $arch" }
              if ($identity.Name -like 'Microsoft.WindowsAppRuntime.*') { $runtime[$arch] = $identity.Version }
              $name = "$($dep.BaseName)_$arch$($dep.Extension)"
              Copy-Item $dep.FullName (Join-Path $depStage $name)
              Write-Host "dependency: $name ($($identity.Name) $($identity.Version) $arch, $($dep.Length) bytes)"
            }
          }
          if (-not $runtime['x64'] -or $runtime['x64'] -ne $runtime['x86']) {
            throw "the Windows App Runtime is '$($runtime['x64'])' for x64 and '$($runtime['x86'])' for x86, not one version"
          }
          Compress-Archive -Path (Get-ChildItem $depStage -File).FullName -DestinationPath (Join-Path $stage "DistrictAI_$($env:VERSION)_x64_sideload-dependencies.zip")
          Get-ChildItem $stage | Select-Object Name, Length | Format-Table -AutoSize

      # Uploaded even when the kit failed, so its report can be read.
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: ${{ !cancelled() }}
        with:
          name: release-windows
          path: ${{ runner.temp }}/release
          retention-days: 7
          if-no-files-found: error

  # Sees files, never source, and runs no build.
  assemble:
    needs: [guard, build]
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
    env:
      VERSION: ${{ needs.guard.outputs.version }}
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: release-*
          merge-multiple: true
          path: assets

      # By name, not by count: a tree whose version drifted from the tag still
      # makes the same number of files.
      - name: The release files are exactly what was expected
        run: |
          set -euo pipefail
          expected="$(printf '%s\n' \
            "DistrictAI_${VERSION}_x64.msixupload" \
            "DistrictAI_${VERSION}_x64_sideload-test.msix" \
            "DistrictAI_${VERSION}_x64_github-unsigned.msix" \
            "DistrictAI_${VERSION}_x64_sideload-dependencies.zip" \
            "DistrictAI_${VERSION}_sideload-test.cer" \
            "DistrictAI_${VERSION}_wack-report.xml" \
            "district-windows-${VERSION}-source.zip" | sort)"
          actual="$(cd assets && find . -type f -printf '%f\n' | sort)"
          if [ "$expected" != "$actual" ]; then
            echo "::error::the built files are not the names a release must carry"
            diff <(printf '%s\n' "$expected") <(printf '%s\n' "$actual") || true
            exit 1
          fi
          printf '%s\n' "$actual"

      - name: SHA256SUMS
        run: |
          set -euo pipefail
          cd assets
          # Written outside assets/ first, so the list does not include itself.
          find . -maxdepth 1 -type f -printf '%f\n' | sort | xargs -d '\n' sha256sum > "$RUNNER_TEMP/SHA256SUMS"
          mv "$RUNNER_TEMP/SHA256SUMS" SHA256SUMS
          [ "$(wc -l < SHA256SUMS)" -eq 7 ] || { echo "::error::SHA256SUMS does not name seven files"; exit 1; }
          cat SHA256SUMS
          sha256sum -c SHA256SUMS

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: release-assets
          path: assets
          retention-days: 7
          if-no-files-found: error

  # The only job that can write to the repository, and only for a tag.
  publish:
    needs: [guard, assemble]
    if: github.event_name == 'push'
    # The `release` environment admits only `v*` tags (and main), so this job,
    # the one that can write, cannot run for anything else.
    environment: release
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      # Creating the release and uploading its assets.
      contents: write
      # Both only for the provenance attestation: id-token to obtain the OIDC
      # token Sigstore signs against, attestations to store the result.
      id-token: write
      attestations: write
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      # This job never checks out the repository, and `gh release` resolves its
      # repository from the working directory's git remote unless told.
      GH_REPO: ${{ github.repository }}
      TAG: ${{ github.ref_name }}
      VERSION: ${{ needs.guard.outputs.version }}
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: release-assets
          path: assets

      - name: The files are the ones SHA256SUMS names
        run: |
          set -euo pipefail
          cd assets
          sha256sum -c SHA256SUMS
          find . -maxdepth 1 -type f -printf '%f\n' | sort > "$RUNNER_TEMP/expected-assets.txt"
          [ "$(wc -l < "$RUNNER_TEMP/expected-assets.txt")" -eq 8 ] || { echo "::error::expected eight files"; exit 1; }

      # Signed provenance over the bytes a user downloads, verifiable with:
      #   gh attestation verify <file> --repo distronode-corporation/district-windows
      - name: Attest build provenance
        id: attest
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: assets/*

      # One Sigstore bundle whose subjects are every file, attached so the
      # files can be verified offline (`--bundle`) and so OpenSSF Scorecard
      # finds provenance on the release.
      - name: Stage the provenance bundle
        env:
          BUNDLE_PATH: ${{ steps.attest.outputs.bundle-path }}
        run: |
          set -euo pipefail
          [ -s "$BUNDLE_PATH" ] || { echo "::error::the attestation step wrote no bundle"; exit 1; }
          mkdir -p provenance
          cp "$BUNDLE_PATH" "provenance/district-ai-windows_${VERSION}.intoto.jsonl"
          echo "district-ai-windows_${VERSION}.intoto.jsonl" >> "$RUNNER_TEMP/expected-assets.txt"
          sort -o "$RUNNER_TEMP/expected-assets.txt" "$RUNNER_TEMP/expected-assets.txt"

      - name: The attestations verify
        run: |
          set -euo pipefail
          for f in assets/*; do
            for attempt in 1 2 3 4 5; do
              if gh attestation verify "$f" --repo "$GITHUB_REPOSITORY"; then
                gh attestation verify "$f" --repo "$GITHUB_REPOSITORY" \
                  --bundle "provenance/district-ai-windows_${VERSION}.intoto.jsonl"
                continue 2
              fi
              echo "attestation for $(basename "$f") not queryable yet (attempt $attempt)"
              sleep 15
            done
            echo "::error::no verifiable attestation for $(basename "$f")"
            exit 1
          done

      # A draft first, so anything below can fail without a half-made release
      # showing. A leftover draft from a failed run is replaced; a public
      # release is never touched.
      - name: Create the draft release
        env:
          NOTES: ${{ needs.guard.outputs.body }}
        run: |
          set -euo pipefail
          if gh release view "$TAG" > /dev/null 2>&1; then
            if [ "$(gh release view "$TAG" --json isDraft --jq .isDraft)" = "true" ]; then
              echo "deleting a leftover draft for $TAG"
              gh release delete "$TAG" --yes
            else
              echo "::error::$TAG is already published. Refusing to modify a public release."
              exit 1
            fi
          fi
          printf '%s\n' "$NOTES" > release-notes.md
          gh release create "$TAG" --draft --verify-tag \
            --title "District AI for Windows $TAG" \
            --notes-file release-notes.md assets/* provenance/*

      - name: GitHub holds every file
        run: |
          set -euo pipefail
          expected="$(cat "$RUNNER_TEMP/expected-assets.txt")"
          [ "$(printf '%s\n' "$expected" | wc -l)" -eq 9 ] || { echo "::error::the expected asset list does not name nine files"; exit 1; }
          actual="$(gh release view "$TAG" --json assets --jq '.assets[].name' | sort)"
          if [ "$expected" != "$actual" ]; then
            echo "::error::the draft does not hold the expected assets; leaving it as a draft"
            diff <(printf '%s\n' "$expected") <(printf '%s\n' "$actual") || true
            exit 1
          fi

      - name: Publish
        run: gh release edit "$TAG" --draft=false --latest

  # The debug files and the Sentry release, once the release is public. It
  # runs no build: it sees the debug files, the checkout for
  # `set-commits --auto` (which reads the commit and the repository's remote),
  # and the token, which nothing else in this workflow holds. On ubuntu, as
  # District AI for Linux's is: sentry-cli reads PE and PDB files on any
  # system, and nothing here needs Windows.
  sentry:
    needs: [guard, publish]
    environment: release
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: read
    env:
      SENTRY_URL: https://de.sentry.io
      SENTRY_ORG: distronode-corporation-eu
      SENTRY_PROJECT: district-windows
      SENTRY_DISABLE_UPDATE_CHECK: "true"
      VERSION: ${{ needs.guard.outputs.version }}
    steps:
      # The whole history, so set-commits can find the previous release's
      # commit.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - uses: $/.github/actions/install-sentry-cli

      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: debug-files-windows
          path: debug-files

      # The eleven files `build` staged, each read on this runner before
      # anything is sent.
      - name: The debug files are what Sentry needs
        run: |
          set -euo pipefail
          find debug-files -type f | sort
          [ "$(find debug-files -type f | wc -l)" -eq 11 ] || { echo "::error::expected exactly eleven debug files"; exit 1; }
          for file in debug-files/rust/district_ffi.dll debug-files/rust/district_ffi.pdb; do
            [ -s "$file" ] || { echo "::error::no $file"; exit 1; }
          done
          find debug-files -type f -print0 | sort -z | xargs -0 -n 1 sentry-cli debug-files check

      - name: Upload the debug files
        env:
          SENTRY_AUTH_TOKEN: ${{ secrets.SENTRY_AUTH_TOKEN }}
        run: sentry-cli debug-files upload debug-files

      # The name the app reports under (CrashReports.SettingsFor): the
      # package's version and the commit's first twelve characters, which
      # `build` stamped on the app as DISTRICT_AI_BUILD.
      - name: Create, link and finalize the Sentry release
        env:
          SENTRY_AUTH_TOKEN: ${{ secrets.SENTRY_AUTH_TOKEN }}
        run: |
          set -euo pipefail
          release="com.distronode.DistrictAI@${VERSION}+${GITHUB_SHA::12}"
          sentry-cli releases new "$release"
          sentry-cli releases set-commits "$release" --auto
          sentry-cli releases finalize "$release"
