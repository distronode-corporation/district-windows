name: CI

# Linux, where everything OS-neutral runs:
#
# - `rust` formats, lints and tests crates/district-ffi (the projection snapshot
#   tests included) and holds its line coverage to coverage-floors.toml, then
#   lints and tests it with the `scripted` feature (the scenes' own tests);
# - `msrv` compiles it at the declared minimum Rust version;
# - `bindings` regenerates the C# bindings and fails if the committed ones differ;
# - `dotnet` tests DistrictAI.Core against the Linux build of district-ffi,
#   tests the view models in DistrictAI.Presentation, and checks the C#
#   formatting;
# - `repo` runs the repository checks under scripts/;
# - `cargo-deny`, `dependency-review` (pull requests only) and `zizmor` are the
#   supply chain.
#
# Windows (windows-2025), where the app is:
#
# - `windows-rust` runs district-ffi's tests on MSVC, the Credential Manager
#   ones included, with the LiveKit call engine linked against the audio-only
#   libwebrtc scripts/fetch-libwebrtc.ps1 pins;
# - `windows-app` tests DistrictAI.Core against district_ffi.dll, tests the
#   view models in DistrictAI.Presentation, checks the formatting of the whole
#   solution, builds the WinUI app with warnings as errors and packages it as
#   an MSIX signed with a throwaway certificate made in the job (never
#   committed, never kept), installs that package and runs the UI smoke tests
#   against it (tests/DistrictAI.UiTests), then builds and packages the GitHub
#   flavour (Package.GitHub.appxmanifest) unsigned, as a release does. Last, it
#   builds district_ffi.dll with the `scripted` feature into a separate
#   scripted test MSIX, never uploaded, and walks every area the pane offers in
#   its signed-in scene, saving a 1920x1080 screenshot of each page. Every DLL
#   and package that ships is checked to carry no scripted code.
#
# Any job on a Windows runner carries `if: ${{ !github.event.repository.private }}`:
# private Windows minutes are metered, public ones are not.
on:
  push:
    branches: [main]
  pull_request:

# Least privilege at the top level, so a job added later starts read-only instead
# of inheriting the repository's default token scope. Nothing in CI writes.
permissions:
  contents: read

# Per ref, and only pull requests cancel in flight: a superseded pull request run
# is waste, a superseded main run is history.
concurrency:
  group: ci-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  CARGO_TERM_COLOR: always
  DOTNET_CLI_TELEMETRY_OPTOUT: "1"
  DOTNET_NOLOGO: "1"

jobs:
  rust:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # rustup is preinstalled, and rust-toolchain.toml names the channel and
      # components. llvm-tools is the llvm-cov and llvm-profdata that match this
      # rustc, for the coverage run only.
      - name: Install the stable toolchain
        run: |
          rustup toolchain install stable --profile minimal -c rustfmt -c clippy -c llvm-tools-preview
          rustc --version

      - name: cargo fmt
        run: cargo fmt --all --check

      # Caches are written from main only. A pull request still restores main's.
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          save-if: ${{ github.ref == 'refs/heads/main' }}

      - name: cargo clippy
        run: cargo clippy --workspace --all-targets --locked -- -D warnings

      - uses: $/.github/actions/install-cargo-llvm-cov

      # The tests are plain `cargo test` with the environment `show-env` prints,
      # so the doctests run too (plain `cargo llvm-cov` leaves them out on
      # stable). The report merges the runs; the text one lists the uncovered
      # lines, the JSON one is what the next step checks.
      - name: cargo test, measuring line coverage
        run: |
          set -euo pipefail
          cargo llvm-cov show-env --sh > "$RUNNER_TEMP/llvm-cov.env"
          # shellcheck source=/dev/null # generated by the line above
          . "$RUNNER_TEMP/llvm-cov.env"
          cargo llvm-cov clean --workspace
          cargo test --workspace --locked
          cargo llvm-cov report --show-missing-lines
          cargo llvm-cov report --json --summary-only --output-path "$RUNNER_TEMP/coverage.json"

      - name: Line coverage meets every floor
        run: python3 scripts/check-coverage.py "$RUNNER_TEMP/coverage.json"

      # The scripted scenes (src/scripted.rs) are compiled only with the
      # feature, so the runs above never see them.
      - name: cargo clippy and test, with the scripted feature
        run: |
          cargo clippy -p district-ffi --all-targets --locked --features scripted -- -D warnings
          cargo test -p district-ffi --locked --features scripted --lib scripted

  # The declared Rust floor, compiled at the floor.
  msrv:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Read the declared MSRV
        id: msrv
        run: |
          msrv="$(python3 -c 'import tomllib;print(tomllib.load(open("Cargo.toml","rb"))["workspace"]["package"]["rust-version"])')"
          echo "msrv=$msrv" >> "$GITHUB_OUTPUT"
          echo "declared rust-version: $msrv"

      # rust-toolchain.toml (stable) outranks the default toolchain, so the floor
      # is pinned with RUSTUP_TOOLCHAIN, which outranks the file, and asserted.
      - name: Install the MSRV toolchain and pin it above rust-toolchain.toml
        env:
          MSRV: ${{ steps.msrv.outputs.msrv }}
        run: |
          rustup toolchain install "$MSRV" --profile minimal
          echo "RUSTUP_TOOLCHAIN=$MSRV" >> "$GITHUB_ENV"

      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          key: msrv-${{ steps.msrv.outputs.msrv }}
          save-if: ${{ github.ref == 'refs/heads/main' }}

      - name: The active compiler really is the floor
        env:
          MSRV: ${{ steps.msrv.outputs.msrv }}
        run: |
          have="$(rustc --version | cut -d' ' -f2)"
          case "$have" in
            "$MSRV" | "$MSRV".*)
              echo "rustc $have honours the declared MSRV $MSRV" ;;
            *)
              echo "::error::rustc is $have, but the declared MSRV is $MSRV. The toolchain pin is not taking effect."
              exit 1 ;;
          esac

      - name: cargo check at the MSRV
        run: cargo check --workspace --all-targets --locked

  # The C# bindings are committed, so a change to district-ffi's interface
  # must bring the regenerated file with it.
  bindings:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install the stable toolchain
        run: rustup toolchain install stable --profile minimal

      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          save-if: ${{ github.ref == 'refs/heads/main' }}

      - uses: $/.github/actions/install-uniffi-bindgen-cs

      - name: The committed bindings are what district-ffi generates
        run: scripts/generate-bindings.sh --check

  # DistrictAI.Core (the bindings and CoreHost) against the Linux build of
  # district-ffi, and the formatting of the projects that build here.
  dotnet:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install the stable toolchain
        run: rustup toolchain install stable --profile minimal

      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          save-if: ${{ github.ref == 'refs/heads/main' }}

      - name: Build district-ffi
        run: cargo build -p district-ffi --locked

      # The SDK global.json names, and the NuGet cache keyed on the lock files.
      - uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          global-json-file: global.json
          cache: true
          cache-dependency-path: "**/packages.lock.json"

      - name: dotnet test
        run: dotnet test tests/DistrictAI.Core.Tests --nologo

      # The view models, OS-neutral, against the core's generated records.
      - name: dotnet test, the view models
        run: dotnet test tests/DistrictAI.Presentation.Tests --nologo

      - name: dotnet format
        run: |
          dotnet format src/DistrictAI.Core/DistrictAI.Core.csproj --verify-no-changes
          dotnet format tests/DistrictAI.Core.Tests/DistrictAI.Core.Tests.csproj --verify-no-changes
          dotnet format src/DistrictAI.Presentation/DistrictAI.Presentation.csproj --verify-no-changes
          dotnet format tests/DistrictAI.Presentation.Tests/DistrictAI.Presentation.Tests.csproj --verify-no-changes

  # Seconds of runtime.
  repo:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: The hygiene check still catches what it claims to
        run: python3 scripts/check-public-hygiene.py --self-test

      - name: Nothing in the tree that must not be public
        run: python3 scripts/check-public-hygiene.py

      - name: The coverage check still catches what it claims to
        run: python3 scripts/check-coverage.py --self-test

      - name: The scripted-build check still catches what it claims to
        run: python3 scripts/check-scripted.py --self-test

      - name: The unsafe check still catches what it claims to
        run: python3 scripts/check-unsafe.py --self-test

      - name: No hand-written unsafe Rust
        run: python3 scripts/check-unsafe.py

      - name: The flavour check still catches what it claims to
        run: python3 scripts/check-flavours.py --self-test

      - name: The Store and GitHub manifests are one app under two identities
        run: python3 scripts/check-flavours.py

      # 1.0 offers no sign-up and no purchase in the app, as its Store listing says.
      - name: No sign-up or purchase wording in the app (and the check still catches it)
        run: |
          python3 scripts/check-store-copy.py --self-test
          python3 scripts/check-store-copy.py

  # RustSec advisories, the licence allow-list, banned crates and allowed sources,
  # read from deny.toml, for both targets it names (windows-msvc and linux-gnu).
  cargo-deny:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: $/.github/actions/install-cargo-deny

      - name: cargo deny check
        run: cargo deny --locked check

  # district-ffi's tests on the target the app ships, the Credential Manager
  # vault's included.
  windows-rust:
    if: ${{ !github.event.repository.private }}
    runs-on: windows-2025
    timeout-minutes: 45
    env:
      # aws-lc-sys (rustls's crypto provider) assembles its x86_64 code with
      # NASM on Windows, and the runner has no NASM: use the objects it ships
      # already assembled.
      AWS_LC_SYS_PREBUILT_NASM: "1"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install the stable toolchain
        run: |
          rustup toolchain install stable --profile minimal
          rustc --version --verbose

      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          save-if: ${{ github.ref == 'refs/heads/main' }}

      # The audio-only libwebrtc the LiveKit engine links, which district-ffi
      # has on Windows: checked against the SHA-256 scripts/fetch-libwebrtc.ps1
      # pins on every run, cached or not, so the cache saves the download and
      # vouches for nothing. It sets LK_CUSTOM_WEBRTC, so the SDK's build never
      # downloads LiveKit's own prebuilt.
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ runner.temp }}/libwebrtc/webrtc-win-x64-release.zip
          key: libwebrtc-win-${{ hashFiles('scripts/fetch-libwebrtc.ps1') }}

      - name: Fetch and verify libwebrtc
        shell: pwsh
        run: ./scripts/fetch-libwebrtc.ps1 (Join-Path $env:RUNNER_TEMP 'libwebrtc') -GitHubEnv

      - name: cargo test -p district-ffi
        run: cargo test -p district-ffi --locked --no-fail-fast

  windows-app:
    if: ${{ !github.event.repository.private }}
    runs-on: windows-2025
    timeout-minutes: 45
    env:
      AWS_LC_SYS_PREBUILT_NASM: "1"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install the stable toolchain
        run: rustup toolchain install stable --profile minimal

      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          save-if: ${{ github.ref == 'refs/heads/main' }}

      # The audio-only libwebrtc the LiveKit engine links, which district-ffi
      # has on Windows: checked against the SHA-256 scripts/fetch-libwebrtc.ps1
      # pins on every run, cached or not, so the cache saves the download and
      # vouches for nothing. It sets LK_CUSTOM_WEBRTC, so the SDK's build never
      # downloads LiveKit's own prebuilt.
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ runner.temp }}/libwebrtc/webrtc-win-x64-release.zip
          key: libwebrtc-win-${{ hashFiles('scripts/fetch-libwebrtc.ps1') }}

      - name: Fetch and verify libwebrtc
        shell: pwsh
        run: ./scripts/fetch-libwebrtc.ps1 (Join-Path $env:RUNNER_TEMP 'libwebrtc') -GitHubEnv

      - name: Build district_ffi.dll
        run: cargo build -p district-ffi --locked --release

      - name: district_ffi.dll has no scripted scenes
        run: python scripts/check-scripted.py --absent target/release/district_ffi.dll

      - uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          global-json-file: global.json
          cache: true
          cache-dependency-path: "**/packages.lock.json"

      - name: dotnet test against district_ffi.dll
        run: dotnet test tests/DistrictAI.Core.Tests --nologo -p:DistrictFfiProfile=release

      - name: dotnet test, the view models
        run: dotnet test tests/DistrictAI.Presentation.Tests --nologo -p:DistrictFfiProfile=release

      # On its own, so a lock file that disagrees with Windows says so here.
      - name: dotnet restore (locked)
        run: dotnet restore DistrictAI.slnx -p:Platform=x64

      # No PDBs (DebugType=none): with any in the payload the packaging step
      # looks for mspdbcmf.exe, from Visual Studio's C++ tools, to build a
      # symbols package, and warns (an error here) when it is missing. A test
      # package has no use for symbols.
      #
      # A certificate made here, for this run's package only: its subject is the
      # manifest's Publisher (read from the manifest, so the two cannot drift), it expires tomorrow, and it is
      # removed from the store when the package is signed. The package is
      # signed by thumbprint, so no private key is ever written to a file. Only
      # the public half is kept, with the package, so a tester can trust it.
      - name: Build the app (warnings are errors) and package a test MSIX
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $publisher = ([xml](Get-Content src/DistrictAI/Package.appxmanifest)).Package.Identity.Publisher
          if (-not $publisher) { throw 'no Identity/@Publisher in the manifest' }
          $cert = New-SelfSignedCertificate -Type Custom -Subject $publisher `
            -KeyUsage DigitalSignature -FriendlyName 'District AI CI test package' `
            -CertStoreLocation 'Cert:\CurrentUser\My' -NotAfter (Get-Date).AddDays(1) `
            -TextExtension @('2.5.29.37={text}1.3.6.1.5.5.7.3.3', '2.5.29.19={text}')
          $out = Join-Path $env:RUNNER_TEMP 'AppPackages'
          try {
            dotnet build src/DistrictAI/DistrictAI.csproj -c Release -p:Platform=x64 `
              -p:DistrictFfiProfile=release -warnaserror `
              -p:GenerateAppxPackageOnBuild=true -p:AppxPackageSigningEnabled=true `
              -p:DebugType=none `
              "-p:PackageCertificateThumbprint=$($cert.Thumbprint)" "-p:AppxPackageDir=$out\"
            if ($LASTEXITCODE -ne 0) { throw "dotnet build failed with $LASTEXITCODE" }
            Export-Certificate -Cert $cert -FilePath (Join-Path $out 'District-AI-CI-test.cer') | Out-Null
          } finally {
            Remove-Item -Path "Cert:\CurrentUser\My\$($cert.Thumbprint)" -DeleteKey
          }
          Get-ChildItem -Recurse $out | Select-Object FullName, Length | Format-Table -AutoSize
          $msix = @(Get-ChildItem -Recurse $out -Filter 'DistrictAI_*.msix')
          if ($msix.Count -ne 1) { throw "expected one DistrictAI MSIX, found $($msix.Count)" }
          $signature = Get-AuthenticodeSignature $msix[0].FullName
          if ($signature.SignerCertificate.Subject -ne $publisher) { throw "unexpected signer: $($signature.SignerCertificate.Subject)" }

      # The Store's certification checks, run here so a failure shows on the
      # pull request rather than at the release tag. The report goes in the
      # uploaded artifact.
      - name: Windows App Certification Kit
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          python scripts/check-wack-report.py --self-test
          if ($LASTEXITCODE -ne 0) { throw 'the WACK report reader failed its self-test' }
          $out = Join-Path $env:RUNNER_TEMP 'AppPackages'
          $msix = @(Get-ChildItem -Recurse $out -Filter 'DistrictAI_*.msix')[0]
          $deps = Join-Path $msix.DirectoryName 'Dependencies\x64'
          ./scripts/run-wack.ps1 -Package $msix.FullName -Certificate (Join-Path $out 'District-AI-CI-test.cer') `
            -Report (Join-Path $out 'wack-report.xml') -Dependencies $(if (Test-Path $deps) { $deps } else { '' })

      # Self-contained: the package carries .NET. The runner has .NET
      # installed, so the app starting here proves nothing about a PC without
      # it (v1.0.0 needed the .NET Desktop Runtime and did not start on one).
      - name: The test MSIX carries its own .NET runtime
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          Add-Type -AssemblyName System.IO.Compression.FileSystem
          $msix = @(Get-ChildItem -Recurse (Join-Path $env:RUNNER_TEMP 'AppPackages') -Filter 'DistrictAI_*.msix' | Where-Object { $_.FullName -notmatch '\\Dependencies\\' })
          if ($msix.Count -ne 1) { throw "expected one DistrictAI MSIX, found $($msix.Count)" }
          $zip = [IO.Compression.ZipFile]::OpenRead($msix[0].FullName)
          try {
            foreach ($runtime in 'hostfxr.dll', 'hostpolicy.dll', 'coreclr.dll') {
              if (-not $zip.GetEntry($runtime)) { throw "the MSIX has no $runtime at its root: it is not self-contained" }
            }
            $config = $zip.GetEntry('DistrictAI.runtimeconfig.json')
            if (-not $config) { throw 'the MSIX has no DistrictAI.runtimeconfig.json' }
            $reader = [IO.StreamReader]::new($config.Open())
            $runtimeConfig = $reader.ReadToEnd() | ConvertFrom-Json
            $reader.Dispose()
            if (-not $runtimeConfig.runtimeOptions.includedFrameworks) { throw "the runtimeconfig has no includedFrameworks: it is framework-dependent" }
            Write-Host "self-contained: $(($runtimeConfig.runtimeOptions.includedFrameworks | ForEach-Object { "$($_.name) $($_.version)" }) -join ', ')"
          } finally { $zip.Dispose() }

      # The package carries libwebrtc's licence texts, which DistrictAI.csproj
      # takes from the archive the fetch step unpacked.
      - name: The test MSIX carries libwebrtc's licences
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          Add-Type -AssemblyName System.IO.Compression.FileSystem
          $msix = @(Get-ChildItem -Recurse (Join-Path $env:RUNNER_TEMP 'AppPackages') -Filter 'DistrictAI_*.msix')
          if ($msix.Count -ne 1) { throw "expected one DistrictAI MSIX, found $($msix.Count)" }
          $zip = [IO.Compression.ZipFile]::OpenRead($msix[0].FullName)
          try {
            $entry = $zip.GetEntry('ThirdPartyNotices/libwebrtc-LICENSE.md')
            if (-not $entry -or $entry.Length -eq 0) { throw 'the MSIX has no ThirdPartyNotices/libwebrtc-LICENSE.md' }
            $want = (Get-Item (Join-Path $env:LK_CUSTOM_WEBRTC 'LICENSE.md')).Length
            if ($entry.Length -ne $want) { throw "ThirdPartyNotices/libwebrtc-LICENSE.md is $($entry.Length) bytes, the archive's is $want" }
            Write-Host "ThirdPartyNotices/libwebrtc-LICENSE.md: $($entry.Length) bytes"
          } finally { $zip.Dispose() }

      # The test MSIX installed as a user installs it and driven through UI
      # Automation (tests/DistrictAI.UiTests, FlaUI): it starts and shows the
      # sign-in page, a districtai:// link while it runs reaches the one
      # instance, closing the window hides it, and the tray menu's Quit ends
      # it. The script trusts the certificate for the run and always removes
      # the package again.
      - name: UI smoke tests of the installed test MSIX
        shell: pwsh
        timeout-minutes: 15
        run: ./scripts/run-ui-tests.ps1 -Packages (Join-Path $env:RUNNER_TEMP 'AppPackages')

      # The GitHub flavour, unsigned, as release.yml builds it, so a flavour
      # that no longer builds or packages fails here and not at a release tag.
      # Its package must carry the GitHub manifest's identity and version.
      - name: Build and package the GitHub flavour (unsigned)
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $out = Join-Path $env:RUNNER_TEMP 'GitHubPackage'
          dotnet build src/DistrictAI/DistrictAI.csproj -c Release -p:Platform=x64 `
            -p:DistrictFfiProfile=release -warnaserror -p:DistrictFlavour=GitHub `
            -p:GenerateAppxPackageOnBuild=true -p:UapAppxPackageBuildMode=SideloadOnly `
            -p:AppxPackageSigningEnabled=false -p:DebugType=none "-p:AppxPackageDir=$out\"
          if ($LASTEXITCODE -ne 0) { throw "dotnet build failed with $LASTEXITCODE" }
          Get-ChildItem -Recurse $out | Select-Object FullName, Length | Format-Table -AutoSize
          $msix = @(Get-ChildItem -Recurse $out -Filter 'DistrictAI_*.msix' | Where-Object { $_.FullName -notmatch '\\Dependencies\\' })
          if ($msix.Count -ne 1) { throw "expected one GitHub flavour MSIX, found $($msix.Count)" }
          if ((Get-AuthenticodeSignature $msix[0].FullName).SignerCertificate) { throw 'the GitHub flavour package is signed; it should not be' }
          $want = ([xml](Get-Content -Raw src/DistrictAI/Package.GitHub.appxmanifest)).Package.Identity
          Add-Type -AssemblyName System.IO.Compression.FileSystem
          $zip = [IO.Compression.ZipFile]::OpenRead($msix[0].FullName)
          try {
            $reader = [IO.StreamReader]::new($zip.GetEntry('AppxManifest.xml').Open())
            $identity = ([xml]$reader.ReadToEnd()).Package.Identity
            $reader.Dispose()
          } finally { $zip.Dispose() }
          foreach ($field in 'Name', 'Publisher', 'Version') {
            if ($identity.$field -ne $want.$field) { throw "GitHub flavour Identity/@$field is '$($identity.$field)', Package.GitHub.appxmanifest says '$($want.$field)'" }
          }
          Write-Host "GitHub flavour: $($identity.Name) $($identity.Version), unsigned"

      - name: dotnet format, the whole solution
        run: dotnet format DistrictAI.slnx --verify-no-changes --no-restore

      # The test package, its framework dependencies and the public test
      # certificate, for testers and for the spikes. Kept a week.
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: district-ai-test-msix
          path: ${{ runner.temp }}/AppPackages
          retention-days: 7
          if-no-files-found: error

      # The scripted test package: district_ffi.dll with the `scripted`
      # feature (made-up data, no network), copied out of the target directory
      # so nothing above or in a later run packages it by mistake, and the
      # app packaged around it under the same throwaway-certificate rules as
      # the test MSIX. Never uploaded: it exists for the walk below.
      - name: Build the scripted district_ffi.dll and package a scripted test MSIX
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          cargo build -p district-ffi --locked --release --features scripted
          if ($LASTEXITCODE -ne 0) { throw "cargo build failed with $LASTEXITCODE" }
          $ffi = Join-Path $env:RUNNER_TEMP 'scripted-ffi'
          New-Item -ItemType Directory -Force $ffi | Out-Null
          Copy-Item target/release/district_ffi.dll $ffi
          python scripts/check-scripted.py --present (Join-Path $ffi 'district_ffi.dll')
          if ($LASTEXITCODE -ne 0) { throw 'the scripted build carries no scripted scenes' }
          $publisher = ([xml](Get-Content src/DistrictAI/Package.appxmanifest)).Package.Identity.Publisher
          $cert = New-SelfSignedCertificate -Type Custom -Subject $publisher `
            -KeyUsage DigitalSignature -FriendlyName 'District AI CI scripted test package' `
            -CertStoreLocation 'Cert:\CurrentUser\My' -NotAfter (Get-Date).AddDays(1) `
            -TextExtension @('2.5.29.37={text}1.3.6.1.5.5.7.3.3', '2.5.29.19={text}')
          $out = Join-Path $env:RUNNER_TEMP 'ScriptedPackages'
          try {
            dotnet build src/DistrictAI/DistrictAI.csproj -c Release -p:Platform=x64 `
              -p:DistrictFfiProfile=release "-p:DistrictFfiDir=$ffi\" -warnaserror `
              -p:GenerateAppxPackageOnBuild=true -p:AppxPackageSigningEnabled=true `
              -p:DebugType=none `
              "-p:PackageCertificateThumbprint=$($cert.Thumbprint)" "-p:AppxPackageDir=$out\"
            if ($LASTEXITCODE -ne 0) { throw "dotnet build failed with $LASTEXITCODE" }
            Export-Certificate -Cert $cert -FilePath (Join-Path $out 'District-AI-CI-scripted.cer') | Out-Null
          } finally {
            Remove-Item -Path "Cert:\CurrentUser\My\$($cert.Thumbprint)" -DeleteKey
          }

      # Every entry the navigation pane offers in the scripted signed-in scene
      # is opened and must render, finish loading and show no failure; each
      # page's client area is saved at 1920x1080 (the display is set larger
      # first), and the whole window once.
      - name: UI walk of the scripted test MSIX, with screenshots
        shell: pwsh
        timeout-minutes: 15
        run: |
          ./scripts/run-ui-tests.ps1 -Packages (Join-Path $env:RUNNER_TEMP 'ScriptedPackages') -Scripted `
            -Screenshots (Join-Path $env:RUNNER_TEMP 'screenshots')

      # The walk's pages, for the Store listing and for review. Kept a week.
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: ${{ !cancelled() }}
        with:
          name: district-ai-screenshots
          path: ${{ runner.temp }}/screenshots
          retention-days: 7
          if-no-files-found: warn

  # Pull requests only: fails a pull request that ADDS a dependency with a known
  # moderate-or-worse vulnerability, or under a licence this Apache-2.0 project
  # cannot ship.
  dependency-review:
    if: github.event_name == 'pull_request' && !github.event.repository.private
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/dependency-review-action@a1d282b36b6f3519aa1f3fc636f609c47dddb294 # v5.0.0
        with:
          fail-on-severity: moderate
          deny-licenses: GPL-2.0-only, GPL-2.0-or-later, GPL-3.0-only, GPL-3.0-or-later, AGPL-3.0-only, AGPL-3.0-or-later, LGPL-2.1-only, LGPL-2.1-or-later, LGPL-3.0-only, LGPL-3.0-or-later, SSPL-1.0, BUSL-1.1
          # Not shipped under the denied licence: r-efi is "MIT OR Apache-2.0 OR
          # LGPL-2.1-or-later" (cargo-deny accepts it under MIT), and
          # Swatinem/rust-cache is a CI action, never in a package.
          allow-dependencies-licenses: pkg:cargo/r-efi, pkg:githubactions/Swatinem/rust-cache

  # Static analysis of these workflows: template injection, over-broad token
  # permissions, credential persistence, cache poisoning, unpinned actions.
  # Suppressions are inline `# zizmor: ignore[...]` comments with a reason.
  zizmor:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: zizmorcore/zizmor-action@cc914d7f3750a2d13d75c7f184a1060aa0e9d482 # v0.6.4
        with:
          version: 1.30.1
          advanced-security: false
          annotations: true
