name: Scorecard

# OpenSSF Scorecard: a third-party read of this repository's supply-chain posture
# (pinned actions, token permissions, branch protection, signed releases and so
# on). Results go to code scanning as SARIF and to the public Scorecard API,
# which is what the README badge reads. Publishing needs a public repository.
#
# Not on pull requests: scorecard-action documents that trigger as experimental,
# and publishing needs `id-token: write`, which means nothing on a pull request.
on:
  push:
    branches: [main]
  schedule:
    - cron: '17 6 * * 1' # weekly, Monday, so a check that decays with time still reports
  workflow_dispatch:

# Nothing at the top level; the job grants exactly what it needs.
permissions: {}

# One run per ref at a time; a newer push supersedes a queued one.
concurrency:
  group: scorecard-${{ github.ref }}
  cancel-in-progress: true

jobs:
  scorecard:
    name: OpenSSF Scorecard
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: read # check out the repository
      actions: read # the workflow runs, for the checks that look at CI
      security-events: write # upload the SARIF to code scanning
      id-token: write # sign the published result, so the public API can tell it came from this repo
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: ossf/scorecard-action@2d1146689b8cda280b9bc96326124645441f03bc # v2.4.4
        with:
          results_file: results.sarif
          results_format: sarif
          publish_results: true

      - uses: github/codeql-action/upload-sarif@2892aa5e19bbd11bc0cff5427e3b750a04d9e3c2 # v4.38.2
        with:
          sarif_file: results.sarif
          category: scorecard
