name: Spikes

# The W2 spikes of the Windows plan, one job each, each with a pass/fail
# verdict and its numbers in the job summary:
#
#   spike-2-*   a UniFFI async call awaiting a C# async callback 10,000 times
#               (no deadlock, steady handles) and a shutdown with callbacks in
#               flight, on Linux and on Windows;
#   spike-3     protocol activation redirect on the installed MSIX;
#   spike-4     the Credential Manager session survives taskkill /f mid-refresh;
#   spike-5     the IncomingCall toast's Answer and Decline, running and cold;
#   spike-6     Native AOT with the generated bindings;
#   spike-7     the website's checkout in WebView2 (no payment is attempted);
#   spike-8     the Store and GitHub flavours installed side by side.
#
# spike-packages builds the packages spikes 3, 5, 7 and 8 install: the app
# with its spike hooks compiled in (-p:DistrictSpikes=true), in both flavours,
# each signed with a throwaway certificate whose subject is that flavour's
# manifest Publisher. The shipped app is built without the hooks.
#
# Not a required check: a spike that fails is a finding, reported, not a
# broken build.
on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: spikes-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  CARGO_TERM_COLOR: always
  DOTNET_CLI_TELEMETRY_OPTOUT: "1"
  DOTNET_NOLOGO: "1"
  AWS_LC_SYS_PREBUILT_NASM: "1"

jobs:
  spike-2-async-callbacks-linux:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install the stable toolchain
        run: rustup toolchain install stable --profile minimal
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - name: Build district-spikes
        run: cargo build -p district-spikes --locked
      - uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          global-json-file: global.json
      - name: Spike 2
        run: |
          printf '### Spike 2 on Linux\n\n| Check | Result | Detail |\n|---|---|---|\n' >> "$GITHUB_STEP_SUMMARY"
          SPIKE_RESULTS="$GITHUB_STEP_SUMMARY" dotnet test tests/DistrictAI.Spikes.Tests --nologo

  spike-2-async-callbacks-windows:
    if: ${{ !github.event.repository.private }}
    runs-on: windows-2025
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install the stable toolchain
        run: rustup toolchain install stable --profile minimal
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - name: Build district-spikes
        run: cargo build -p district-spikes --locked --release
      - uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          global-json-file: global.json
      - name: Spike 2
        shell: bash
        run: |
          printf '### Spike 2 on Windows\n\n| Check | Result | Detail |\n|---|---|---|\n' >> "$GITHUB_STEP_SUMMARY"
          SPIKE_RESULTS="$GITHUB_STEP_SUMMARY" dotnet test tests/DistrictAI.Spikes.Tests --nologo -p:DistrictFfiProfile=release

  spike-4-credential-manager-kill:
    if: ${{ !github.event.repository.private }}
    runs-on: windows-2025
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install the stable toolchain
        run: rustup toolchain install stable --profile minimal
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - name: Spike 4
        shell: bash
        run: |
          printf '### Spike 4: taskkill mid-refresh\n\n| Check | Result | Detail |\n|---|---|---|\n' >> "$GITHUB_STEP_SUMMARY"
          SPIKE_RESULTS="$GITHUB_STEP_SUMMARY" cargo test -p district-ffi --locked --test spike_kill_mid_refresh -- --nocapture

  spike-6-native-aot:
    if: ${{ !github.event.repository.private }}
    runs-on: windows-2025
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install the stable toolchain
        run: rustup toolchain install stable --profile minimal
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - name: Build the native libraries
        run: cargo build -p district-ffi -p district-spikes --locked --release
      - uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          global-json-file: global.json
      # Trim and AOT analysis warnings are errors (TreatWarningsAsErrors), so a
      # publish that succeeds is one the analyzers accepted.
      - name: Publish the probe with Native AOT
        run: dotnet publish spikes/AotProbe -c Release -r win-x64 -p:DistrictFfiProfile=release -o "${{ runner.temp }}/aot"
      - name: Spike 6
        shell: bash
        run: |
          printf '### Spike 6: Native AOT\n\n| Check | Result | Detail |\n|---|---|---|\n' >> "$GITHUB_STEP_SUMMARY"
          ls -la "$RUNNER_TEMP/aot"
          SPIKE_RESULTS="$GITHUB_STEP_SUMMARY" "$RUNNER_TEMP/aot/AotProbe.exe"

  spike-packages:
    if: ${{ !github.event.repository.private }}
    runs-on: windows-2025
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install the stable toolchain
        run: rustup toolchain install stable --profile minimal
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - name: Build district_ffi.dll
        run: cargo build -p district-ffi --locked --release
      - uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          global-json-file: global.json
      - name: The flavours are one app under two identities
        run: python scripts/check-flavours.py
      # Per flavour: a throwaway certificate whose subject is that flavour's
      # manifest Publisher (the package refuses to install otherwise), removed
      # from the store once the package is signed; the package's signer is
      # then checked against the manifest.
      - name: Build both flavours with the spike hooks
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          foreach ($flavour in 'Store', 'GitHub') {
            $manifest = if ($flavour -eq 'Store') { 'src/DistrictAI/Package.appxmanifest' } else { 'src/DistrictAI/Package.GitHub.appxmanifest' }
            $publisher = ([xml](Get-Content -Raw $manifest)).Package.Identity.Publisher
            $cert = New-SelfSignedCertificate -Type Custom -Subject $publisher `
              -KeyUsage DigitalSignature -FriendlyName "District AI spike package ($flavour)" `
              -CertStoreLocation 'Cert:\CurrentUser\My' -NotAfter (Get-Date).AddDays(1) `
              -TextExtension @('2.5.29.37={text}1.3.6.1.5.5.7.3.3', '2.5.29.19={text}')
            $out = Join-Path $env:RUNNER_TEMP "spike-$flavour"
            try {
              dotnet build src/DistrictAI/DistrictAI.csproj -c Release -p:Platform=x64 `
                -p:DistrictFfiProfile=release -p:DistrictSpikes=true "-p:DistrictFlavour=$flavour" `
                -p:GenerateAppxPackageOnBuild=true -p:AppxPackageSigningEnabled=true `
                -p:DebugType=none `
                "-p:PackageCertificateThumbprint=$($cert.Thumbprint)" "-p:AppxPackageDir=$out\"
              if ($LASTEXITCODE -ne 0) { throw "the $flavour build failed" }
              Export-Certificate -Cert $cert -FilePath (Join-Path $out 'spike-test.cer') | Out-Null
            } finally {
              Remove-Item -Path "Cert:\CurrentUser\My\$($cert.Thumbprint)" -DeleteKey
            }
            $msix = @(Get-ChildItem -Recurse $out -Filter 'DistrictAI_*.msix' | Where-Object { $_.FullName -notmatch '\\Dependencies\\' })
            if ($msix.Count -ne 1) { throw "expected one $flavour package, found $($msix.Count)" }
            $signer = (Get-AuthenticodeSignature $msix[0].FullName).SignerCertificate.Subject
            if ($signer -ne $publisher) { throw "$flavour package signed by '$signer', manifest Publisher '$publisher'" }
            Write-Host "$flavour package $($msix[0].Name) signed by $signer"
          }
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: spike-packages
          path: |
            ${{ runner.temp }}/spike-Store
            ${{ runner.temp }}/spike-GitHub
          retention-days: 3
          if-no-files-found: error

  spike-3-protocol-redirect:
    needs: spike-packages
    runs-on: windows-2025
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: spike-packages
          path: ${{ runner.temp }}/spike
      - name: Spike 3
        shell: pwsh
        run: scripts/spikes/spike3-protocol-redirect.ps1 -Packages "$env:RUNNER_TEMP/spike/spike-Store"

  spike-5-incoming-call-toast:
    needs: spike-packages
    runs-on: windows-2025
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: spike-packages
          path: ${{ runner.temp }}/spike
      - name: Spike 5
        shell: pwsh
        run: scripts/spikes/spike5-incoming-call-toast.ps1 -Packages "$env:RUNNER_TEMP/spike/spike-Store" -Manifest src/DistrictAI/Package.appxmanifest

  spike-7-checkout-webview2:
    needs: spike-packages
    runs-on: windows-2025
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: spike-packages
          path: ${{ runner.temp }}/spike
      - name: Spike 7
        shell: pwsh
        run: scripts/spikes/spike7-checkout-webview2.ps1 -Packages "$env:RUNNER_TEMP/spike/spike-Store"

  spike-8-two-flavours:
    needs: spike-packages
    runs-on: windows-2025
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: spike-packages
          path: ${{ runner.temp }}/spike
      - name: Spike 8
        shell: pwsh
        run: scripts/spikes/spike8-two-flavours.ps1 -StorePackages "$env:RUNNER_TEMP/spike/spike-Store" -GitHubPackages "$env:RUNNER_TEMP/spike/spike-GitHub"
